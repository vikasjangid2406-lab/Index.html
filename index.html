<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikaas AI Studio</title>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --card-bg: #1d1833;
            --accent-color: #ff007f;
            --text-color: #ffffff;
            --text-muted: #a09cb0;
        }

        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            min-height: 100vh;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #2d264d;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            background: linear-gradient(45deg, #ff007f, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #130f24;
            border: 1px solid #3d3466;
            border-radius: 12px;
            color: white;
            padding: 12px;
            box-sizing: border-box;
            resize: none;
            font-size: 14px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .ratio-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .ratio-btn {
            background: #130f24;
            border: 1px solid #3d3466;
            color: white;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
        }

        .ratio-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        .generate-btn {
            background: linear-gradient(90deg, #ff007f, #8a2be2);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        .generate-btn:disabled {
            background: #444;
            cursor: not-allowed;
        }

        .output-area {
            margin-top: 10px;
            background: #130f24;
            border: 1px dashed #3d3466;
            border-radius: 12px;
            min-height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .placeholder-text {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Vikaas AI Studio</h1>
        </header>

        <div class="content">
            <div class="input-group">
                <label for="prompt">Describe your cinematic video:</label>
                <textarea id="prompt" placeholder="e.g., A cinematic, ultra-realistic woman walking around Jodhpur..."></textarea>
            </div>

            <div class="input-group">
                <label>Aspect Ratio:</label>
                <div class="ratio-selector">
                    <div class="ratio-btn active" onclick="setRatio(this, '9:16')">9:16 (Portrait / Reels)</div>
                    <div class="ratio-btn" onclick="setRatio(this, '16:9')">16:9 (Landscape)</div>
                </div>
            </div>

            <button class="generate-btn" id="genBtn" onclick="generateVideo()">Generate AI Video</button>

            <label>Result:</label>
            <div class="output-area" id="outputArea">
                <div class="placeholder-text" id="placeholder">Your generated video will appear here...</div>
                <div class="loader" id="loader"></div>
            </div>
        </div>
    </div>

    <script>
        let selectedRatio = '9:16';
        
        // आपकी असली Runway API Key यहाँ सेट कर दी गई है
        const RUNWAY_API_KEY = "Key_a2737179651db811211816c0ccdd606685d6b5f2df5cd764f5da2cddf9c042154547695fa718a68ed0da81891e6ff9e6e1992e82873e58c99e3d2e2536441cf7"; 

        function setRatio(element, ratio) {
            document.querySelectorAll('.ratio-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            selectedRatio = ratio;
        }

        async function generateVideo() {
            const promptText = document.getElementById('prompt').value;
            if (!promptText.trim()) {
                alert("Please enter a prompt first!");
                return;
            }

            const placeholder = document.getElementById('placeholder');
            const loader = document.getElementById('loader');
            const outputArea = document.getElementById('outputArea');
            const genBtn = document.getElementById('genBtn');

            placeholder.style.display = 'none';
            loader.style.display = 'block';
            genBtn.disabled = true;

            const oldVideo = outputArea.querySelector('video');
            if (oldVideo) oldVideo.remove();

            try {
                const response = await fetch('https://api.runwayml.com/v1/image_to_video', { 
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${RUNWAY_API_KEY}`,
                        'Content-Type': 'application/json',
                        'X-Runway-Version': '2024-11-06'
                    },
                    body: JSON.stringify({
                        promptImage: null, 
                        promptText: promptText,
                        model: "gen3a_turbo", 
                        aspectRatio: selectedRatio
                    })
                });

                const task = await response.json();
                if (!task.id) throw new Error("Task failed");

                checkStatus(task.id);

            } catch (error) {
                showError();
            }
        }

        async function checkStatus(taskId) {
            try {
                const checkResponse = await fetch(`https://api.runwayml.com/v1/tasks/${taskId}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${RUNWAY_API_KEY}`,
                        'X-Runway-Version': '2024-11-06'
                    }
                });

                const taskStatus = await checkResponse.json();

                if (taskStatus.status === 'SUCCEEDED') {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('genBtn').disabled = false;

                    const video = document.createElement('video');
                    video.src = taskStatus.output[0]; 
                    video.controls = true;
                    video.autoplay = true;
                    video.loop = true;
                    document.getElementById('outputArea').appendChild(video);

                } else if (taskStatus.status === 'FAILED') {
                    showError();
                } else {
                    setTimeout(() => checkStatus(taskId), 4000);
                }
            } catch (error) {
                showError();
            }
        }

        function showError() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('placeholder').style.display = 'block';
            document.getElementById('genBtn').disabled = false;
            alert("वीडियो जनरेशन शुरू नहीं हो पाया। कृपया इंटरनेट कनेक्शन या अपनी API Key की लिमिट्स चेक करें।");
        }
    </script>
</body>
</html>
