<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikaas AI Studio</title>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --card-bg: #1d1833;
            --accent-color: #ff007f;
            --text-color: #ffffff;
            --text-muted: #a09cb0;
        }

        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            min-height: 100vh;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #2d264d;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            background: linear-gradient(45deg, #ff007f, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #130f24;
            border: 1px solid #3d3466;
            border-radius: 12px;
            color: white;
            padding: 12px;
            box-sizing: border-box;
            resize: none;
            font-size: 14px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .ratio-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .ratio-btn {
            background: #130f24;
            border: 1px solid #3d3466;
            color: white;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
        }

        .ratio-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        .generate-btn {
            background: linear-gradient(90deg, #ff007f, #8a2be2);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }

        .generate-btn:disabled {
            background: #444;
            cursor: not-allowed;
        }

        .output-area {
            margin-top: 10px;
            background: #130f24;
            border: 1px dashed #3d3466;
            border-radius: 12px;
            min-height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .placeholder-text {
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Vikaas AI Studio</h1>
        </header>

        <div class="content">
            <div class="input-group">
                <label for="prompt">Describe your cinematic video:</label>
                <textarea id="prompt" placeholder="e.g., A cinematic, ultra-realistic landscape of Jodhpur during sunset..."></textarea>
            </div>

            <div class="input-group">
                <label>Aspect Ratio:</label>
                <div class="ratio-selector">
                    <div class="ratio-btn active" onclick="setRatio(this, '9:16')">9:16 (Portrait / Reels)</div>
                    <div class="ratio-btn" onclick="setRatio(this, '16:9')">16:9 (Landscape)</div>
                </div>
            </div>

            <button class="generate-btn" id="genBtn" onclick="generateVideo()">Generate AI Video</button>

            <label>Result:</label>
            <div class="output-area" id="outputArea">
                <div class="placeholder-text" id="placeholder">Your generated video will appear here...</div>
                <div class="loader" id="loader"></div>
            </div>
        </div>
    </div>

    <script>
        let selectedRatio = '9:16';

        function setRatio(element, ratio) {
            document.querySelectorAll('.ratio-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            selectedRatio = ratio;
        }

        async function generateVideo() {
            const promptText = document.getElementById('prompt').value;
            if (!promptText.trim()) {
                alert("Please enter a prompt first!");
                return;
            }

            const placeholder = document.getElementById('placeholder');
            const loader = document.getElementById('loader');
            const outputArea = document.getElementById('outputArea');
            const genBtn = document.getElementById('genBtn');

            placeholder.style.display = 'none';
            loader.style.display = 'block';
            genBtn.disabled = true;

            const oldVideo = outputArea.querySelector('video');
            if (oldVideo) oldVideo.remove();

            try {
                // Pollinations AI - 100% फ्री वीडियो जनरेशन API
                const cleanPrompt = encodeURIComponent(promptText);
                const randomSeed = Math.floor(Math.random() * 1000000);
                
                // वीडियो जेनरेट करने का यूआरएल
                const videoUrl = `https://text-to-video.pollinations.ai/generate?prompt=${cleanPrompt}&seed=${randomSeed}&width=${selectedRatio === '9:16' ? 576 : 1024}&height=${selectedRatio === '9:16' ? 1024 : 576}`;

                // वीडियो लोड होने की जांच
                const video = document.createElement('video');
                video.src = videoUrl;
                video.controls = true;
                video.autoplay = true;
                video.loop = true;

                video.onloadeddata = () => {
                    loader.style.display = 'none';
                    genBtn.disabled = false;
                    outputArea.appendChild(video);
                };

                video.onerror = () => {
                    throw new Error("Failed to load video");
                };

            } catch (error) {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('placeholder').style.display = 'block';
                document.getElementById('genBtn').disabled = false;
                alert("वीडियो जनरेट करने में थोड़ा समय लग रहा है या सर्वर बिजी है। कृपया एक बार फिर से बटन दबाएं।");
            }
        }
    </script>
</body>
</html>
